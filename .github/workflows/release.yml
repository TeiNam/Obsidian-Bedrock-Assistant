name: Release Obsidian Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "릴리즈 대상 브랜치"
        required: true
        type: choice
        options:
          - main
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # version bump 커밋은 릴리즈 스킵 (무한 루프 방지)
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Determine branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Determine edition prefix
        id: edition
        run: |
          BRANCH="${{ steps.branch.outputs.ref }}"
          PREFIX="agent-llms"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "에디션: $PREFIX (브랜치: $BRANCH)"

      - name: Bump version
        id: version
        run: |
          CURRENT=$(node -p "require('./manifest.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # 이미 릴리스된 버전인지 확인한다. manifest에 적힌 버전의 태그가 없으면
          # 그 버전을 그대로 배포한다 — bump하면 의도한 버전(예: 0.3.0)을 건너뛰고
          # 0.3.1로 나가버린다. 태그가 이미 있으면 patch를 올려 중복을 피한다.
          PREFIX="${{ steps.edition.outputs.prefix }}"
          if git rev-parse -q --verify "refs/tags/$PREFIX-$CURRENT" >/dev/null; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "태그 $PREFIX-$CURRENT 이미 존재 → $NEW_VERSION 으로 증가"
          else
            NEW_VERSION="$CURRENT"
            echo "태그 $PREFIX-$CURRENT 없음 → manifest 버전 그대로 배포"
          fi
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # manifest.json 업데이트
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
            m.version = '$NEW_VERSION';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

          # package.json 업데이트
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

          # versions.json 업데이트 (파일이 있는 경우만)
          if [ -f versions.json ]; then
            node -e "
              const fs = require('fs');
              const v = JSON.parse(fs.readFileSync('versions.json','utf8'));
              const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
              v[manifest.version] = manifest.minAppVersion;
              fs.writeFileSync('versions.json', JSON.stringify(v, null, 2) + '\n');
            "
          fi

          echo "버전 업데이트: $CURRENT → $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json versions.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "chore: bump version to ${{ steps.version.outputs.new }}" && git push origin HEAD:${{ steps.edition.outputs.branch }})

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.edition.outputs.prefix }}-${{ steps.version.outputs.new }}
          name: "${{ steps.edition.outputs.prefix }} v${{ steps.version.outputs.new }}"
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
